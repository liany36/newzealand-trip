<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>火山喷发 · D</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0a12;font-family:system-ui,"Microsoft YaHei",sans-serif}
  #c{display:block;width:100%;height:100%}
  #hud{position:fixed;top:10px;left:10px;color:#ffd9a0;font-size:13px;background:rgba(10,10,18,.55);padding:10px 14px;border-radius:8px;line-height:1.9;user-select:none}
  #hud b{color:#fff}
  #fps{position:fixed;top:10px;right:12px;color:#7fffb0;font:14px monospace;background:rgba(10,10,18,.55);padding:6px 10px;border-radius:6px}
  #hud label{display:block}
  #hud input[type=range]{width:150px;vertical-align:middle}
  #hud button{margin-top:6px;padding:4px 14px;background:#c0392b;color:#fff;border:0;border-radius:5px;cursor:pointer}
  #phys{position:fixed;bottom:10px;left:10px;max-width:520px;color:#ccc;font-size:12px;background:rgba(10,10,18,.55);padding:8px 12px;border-radius:8px;line-height:1.6}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <b>火山喷发</b>
  <label>喷发强度 <input id="power" type="range" min="0.3" max="2.5" step="0.05" value="1.2"> <span id="powerV">1.20</span></label>
  <label>粒子数 <input id="count" type="range" min="200" max="4000" step="100" value="1800"> <span id="countV">1800</span></label>
  <label>重力 <input id="grav" type="range" min="3" max="20" step="0.5" value="9.8"> <span id="gravV">9.8</span></label>
  <label>风速 <input id="wind" type="range" min="-3" max="3" step="0.1" value="0.6"> <span id="windV">0.6</span></label>
  <button id="reset">重置</button>
</div>
<div id="fps">-- FPS</div>
<div id="phys">物理自检：碎屑以初速 v₀ 喷出后只受重力 g（忽略阻力），最高点 h=v₀²/2g；v₀ 由喷发强度决定，调大强度 h 按平方涨，调大重力 h 反比降。烟尘受浮力+风扩散，不参与弹道。</div>
<script src="vendor/three.min.js"></script>
<script src="volcano.js"></script>
</body>
</html>
