<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>新西兰访客签证办理清单</title>
    <base href="/trips/nz/visa/" />
    <link rel="stylesheet" href="css/handbook.css?v=path1" />
  </head>
  <body>
    <div class="shell">
      <nav class="sidenav" aria-label="页面导航" data-sidenav></nav>

      <div class="page">
        <h1>新西兰访客签证办理清单</h1>
        <p class="meta">
          <span data-subtitle></span><br />
          <span data-asof></span>
          · <span data-reviewed></span>
          · 今日 <span data-today></span>
        </p>

        <p class="next" data-next>
          当前事项：<a href="#"><strong data-next-text></strong></a>
        </p>

        <h2 id="sec-timeline">办理排期</h2>
        <p class="meta">按勾选进度推进；标注日期仅供参考。勾选后，「当前事项」指向下一项未完成任务。</p>
        <div data-timeline></div>

        <h2 id="sec-batches">外勤合并建议</h2>
        <p class="meta">以下非排期本身，仅用于减少往返次数：同一地点可一次办结的事项。</p>
        <div data-batches></div>

        <h2 id="sec-templates">模板文件</h2>
        <p class="meta">「打开」为在线预览，「下载」为保存至本地。</p>
        <ul class="tpl-list" data-templates></ul>

        <h2 id="sec-docs">材料一览</h2>
        <p class="meta">普通文件：PDF，单个不超过 10MB，不得加密。照片：JPG/JPEG，竖版 3:4。</p>
        <ul class="doc-table" data-docs></ul>

        <h2 id="sec-funds">资金要求</h2>
        <ul class="zebra" data-funds></ul>

        <h2 id="sec-paths">申请路径</h2>
        <div data-paths></div>

        <h2 id="sec-preflight">递交前核对</h2>
        <ul class="checks" data-preflight></ul>

        <h2 id="sec-links">官方链接</h2>
        <ul class="zebra links" data-links></ul>
      </div>
    </div>

    <script src="js/handbook-data.js?v=path1"></script>
    <script src="js/handbook.js?v=path1"></script>
  </body>
</html>
